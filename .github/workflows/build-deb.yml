name: Build Debian package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: milestone/05-settings
        type: string
      release_tag:
        description: GitHub release tag to attach the package to
        required: true
        default: v1.0.0
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Debian package
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          version="${release_tag#v}"
          package_root="${RUNNER_TEMP}/ember-package"
          deb_path="${RUNNER_TEMP}/ember_${version}_amd64.deb"

          install -d "${package_root}/DEBIAN" "${package_root}/usr/bin"
          install -d "${package_root}/usr/share/applications"
          install -d "${package_root}/usr/share/icons/hicolor/scalable/apps"
          install -d "${package_root}/opt/ember"

          python -m pip install --no-compile --no-warn-script-location \
            --target "${package_root}/opt/ember" .

          cat > "${package_root}/usr/bin/ember" <<'EOF'
          #!/bin/sh
          export PYTHONPATH="/opt/ember${PYTHONPATH:+:$PYTHONPATH}"
          exec /usr/bin/python3 -m ember "$@"
          EOF
          chmod 755 "${package_root}/usr/bin/ember"

          install -m 644 packaging/ember.desktop \
            "${package_root}/usr/share/applications/ember.desktop"
          install -m 644 packaging/ember.svg \
            "${package_root}/usr/share/icons/hicolor/scalable/apps/ember.svg"

          cat > "${package_root}/DEBIAN/control" <<EOF
          Package: ember
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: python3, libsecret-1-0, libxkbcommon0, libxkbcommon-x11-0, libxcb-cursor0, libegl1, libgl1
          Maintainer: Ember contributors
          Description: Ember desktop companion
           Your pixel-art desktop companion for Linux.
          EOF

          dpkg-deb --build --root-owner-group "${package_root}" "${deb_path}"
          echo "path=${deb_path}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify package
        run: dpkg-deb --info "${{ steps.package.outputs.path }}"

      - name: Publish package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          DEB_PATH: ${{ steps.package.outputs.path }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${DEB_PATH}" \
              --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${DEB_PATH}" \
              --title "Ember ${VERSION}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
